<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KinoBase Pro — всі фільми безкоштовно</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #080b12;
            color: #eef2f8;
            padding: 0 0 90px 0;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #121820;
        }
        ::-webkit-scrollbar-thumb {
            background: #f5a042;
            border-radius: 20px;
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 60;
            background: rgba(8, 11, 18, 0.92);
            backdrop-filter: blur(22px) saturate(200%);
            -webkit-backdrop-filter: blur(22px) saturate(200%);
            padding: 14px 18px 10px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.8px;
            background: linear-gradient(135deg, #f7b84d, #f58a3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-badge {
            font-size: 10px;
            background: rgba(245, 138, 60, 0.18);
            padding: 3px 14px;
            border-radius: 40px;
            color: #f5a042;
            border: 1px solid rgba(245, 138, 60, 0.25);
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .header-count {
            font-size: 13px;
            color: #6a7a92;
            font-weight: 500;
        }

        /* SEARCH */
        .search-wrap {
            padding: 14px 18px 6px 18px;
        }
        .search-box {
            width: 100%;
            padding: 15px 20px;
            border-radius: 18px;
            background: #141c28;
            border: 1.5px solid #1e2a38;
            color: #eef2f8;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            -webkit-appearance: none;
            font-weight: 400;
        }
        .search-box:focus {
            border-color: #f5a042;
            background: #18212e;
            box-shadow: 0 0 0 5px rgba(245, 160, 66, 0.07);
        }
        .search-box::placeholder {
            color: #5a6a7e;
        }

        /* FILTERS */
        .filters {
            display: flex;
            gap: 10px;
            padding: 12px 18px 16px 18px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            white-space: nowrap;
        }
        .filters::-webkit-scrollbar {
            display: none;
        }
        .filter-chip {
            flex-shrink: 0;
            padding: 8px 20px;
            border-radius: 40px;
            background: #141c28;
            color: #8a9ab0;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #1e2a38;
            transition: 0.2s;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            letter-spacing: 0.2px;
        }
        .filter-chip.active {
            background: linear-gradient(135deg, #f7b84d, #f58a3c);
            color: #080b12;
            border-color: #f5a042;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(245, 160, 66, 0.25);
        }

        /* GRID */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 6px 16px 20px 16px;
        }
        @media (min-width: 480px) {
            .movies-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
                padding: 10px 24px 24px 24px;
            }
        }
        @media (min-width: 720px) {
            .movies-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 24px;
                padding: 14px 32px 32px 32px;
            }
        }

        /* CARD */
        .movie-card {
            background: #101822;
            border-radius: 22px;
            overflow: hidden;
            transition: transform 0.18s cubic-bezier(0.2, 0.9, 0.4, 1), box-shadow 0.3s;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            -webkit-touch-callout: none;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .movie-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.9);
            border-color: rgba(245, 160, 66, 0.15);
        }
        .movie-card:active {
            transform: scale(0.95);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: #0d1420;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background-image: radial-gradient(circle at 30% 40%, #1a2535, #0a0f18);
        }
        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }
        .movie-card:hover .movie-poster img {
            transform: scale(1.03);
        }
        .movie-poster .fallback {
            font-size: 64px;
            opacity: 0.15;
            font-weight: 300;
        }
        .movie-year-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            color: #d0daea;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .movie-rating-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            color: #f5c542;
            border: 1px solid rgba(245, 197, 66, 0.15);
        }

        .movie-info {
            padding: 14px 16px 16px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .movie-title {
            font-weight: 700;
            font-size: 15px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #f0f4fc;
            letter-spacing: -0.2px;
        }
        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #6a7e96;
            margin-top: 6px;
        }
        .movie-genre-tag {
            background: #1a2535;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            color: #9aaecc;
            border: 1px solid #1e2a38;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .movie-quality {
            font-size: 9px;
            background: rgba(245, 160, 66, 0.12);
            padding: 2px 10px;
            border-radius: 30px;
            color: #f5a042;
            font-weight: 700;
            letter-spacing: 0.3px;
            border: 1px solid rgba(245, 160, 66, 0.08);
        }

        /* PLAYER OVERLAY */
        .player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            z-index: 999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeUp 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }
        .player-overlay.active {
            display: flex;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: scale(0.96) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .player-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.25s;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        .player-close:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.12);
        }

        .player-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #080b12;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .player-title {
            color: #eef2f8;
            font-size: 18px;
            font-weight: 700;
            margin-top: 20px;
            text-align: center;
            max-width: 90%;
            padding: 0 16px;
            letter-spacing: -0.2px;
        }
        .player-sub {
            color: #6a7e96;
            font-size: 13px;
            margin-top: 4px;
        }

        /* EMPTY */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: #5a6a7e;
        }
        .empty-state span {
            display: block;
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .empty-state h3 {
            color: #8a9ab0;
            font-weight: 600;
            font-size: 18px;
        }

        /* LOADING */
        .loading-spinner {
            display: flex;
            justify-content: center;
            padding: 60px 0;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #1e2a38;
            border-top-color: #f5a042;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: #141c28;
            color: #eef2f8;
            padding: 14px 28px;
            border-radius: 60px;
            border: 1px solid #1e2a38;
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.35s, transform 0.35s;
            pointer-events: none;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            letter-spacing: 0.2px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* SCROLL TO TOP BUTTON */
        .scroll-top {
            position: fixed;
            bottom: 28px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7b84d, #f58a3c);
            border: none;
            color: #080b12;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(245, 160, 66, 0.35);
            transition: 0.25s;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 40;
            -webkit-tap-highlight-color: transparent;
        }
        .scroll-top:active {
            transform: scale(0.88);
        }
        .scroll-top.visible {
            display: flex;
        }

        .footer-spacer {
            height: 20px;
        }
    </style>
</head>

        ];

        // ============================================================
        // СТАН
        // ============================================================
        let allMovies = [];
        let filteredMovies = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let isLoading = true;

        const container = document.getElementById('moviesContainer');
        const searchInput = document.getElementById('searchInput');
        const filterChips = document.querySelectorAll('.filter-chip');
        const playerOverlay = document.getElementById('playerOverlay');
        const playerIframe = document.getElementById('playerIframe');
        const playerTitle = document.getElementById('playerTitle');
        const playerSub = document.getElementById('playerSub');
        const playerClose = document.getElementById('playerClose');
        const toast = document.getElementById('toast');
        const scrollBtn = document.getElementById('scrollTopBtn');
        const movieCountEl = document.getElementById('movieCount');

        let toastTimeout = null;

        // ============================================================
        // SUPABASE FETCH
        // ============================================================
        async function fetchSupabaseMovies() {
            try {
                const SUPABASE_URL = 'https://qxtakglepnrnewwynnij.supabase.co';
                const SUPABASE_KEY = 'sb_publishable_W2Db_WneZp2gyi_MUtJ8tQ_dx29imBX';

                const resp = await fetch(`${SUPABASE_URL}/rest/v1/movies?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (!resp.ok) return [];
                const data = await resp.json();
                if (!Array.isArray(data)) return [];
                return data.map(item => ({
                    id: item.id || Date.now() + Math.random() * 1000,
                    title: item.title || 'Невідомий фільм',
                    year: item.year || 2024,
                    genre: item.genre || 'драма',
                    rating: item.rating || 5.0,
                    poster: item.poster || '',
                    video: item.video || 'https://vidsrc.xyz/embed/movie/157336'
                }));
            } catch (e) {
                return [];
            }
        }

        // ============================================================
        // РЕНДЕРИНГ
        // ============================================================
        function renderMovies(movies) {
            if (!movies || movies.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span>🎞️</span>
                        <h3>Фільмів не знайдено</h3>
                        <p style="color:#4a5a6e; margin-top:8px;">спробуйте змінити фільтр або пошук</p>
                    </div>
                `;
                movieCountEl.textContent = '0 фільмів';
                return;
            }

            let html = '<div class="movies-grid">';
            for (const m of movies) {
                const posterHtml = m.poster
                    ? `<img src="${m.poster}" alt="${m.title}" loading="lazy" onerror="this.style.display='none';this.parentElement.querySelector('.fallback').style.display='flex';">`
                    : '';
                html += `
                    <div class="movie-card" data-id="${m.id}" data-video="${m.video}" data-title="${m.title}">
                        <div class="movie-poster">
                            ${posterHtml}
                            <span class="fallback" style="display:${m.poster ? 'none' : 'flex'};">🎬</span>
                            <span class="movie-year-badge">${m.year}</span>
                            <span class="movie-rating-badge">★ ${m.rating.toFixed(1)}</span>
                        </div>
                        <div class="movie-info">
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-meta">
                                <span class="movie-genre-tag">${m.genre}</span>
                                <span class="movie-quality">HD</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            container.innerHTML = html;
            movieCountEl.textContent = `${movies.length} фільмів`;

            // Обробники
            document.querySelectorAll('.movie-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    const video = this.dataset.video;
                    const title = this.dataset.title || 'Фільм';
                    if (video) {
                        openPlayer(video, title);
                    } else {
                        showToast('⚠️ Відео тимчасово недоступне');
                    }
                });
                card.addEventListener('touchstart', function() {
                    this.style.transition = 'transform 0.05s';
                }, { passive: true });
            });
        }

        // ============================================================
        // ФІЛЬТРАЦІЯ
        // ============================================================
        function applyFilters() {
            let result = allMovies.slice();

            if (currentFilter !== 'all') {
                const f = currentFilter.toLowerCase();
                result = result.filter(m => {
                    const genreMatch = m.genre && m.genre.toLowerCase().includes(f);
                    const yearMatch = m.year && m.year.toString() === f;
                    return genreMatch || yearMatch;
                });
            }

            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                result = result.filter(m =>
                    m.title.toLowerCase().includes(q) ||
                    (m.genre && m.genre.toLowerCase().includes(q)) ||
                    (m.year && m.year.toString().includes(q))
                );
            }

            filteredMovies = result;
            renderMovies(result);
        }

        // ============================================================
        // ПЛЕЄР
        // ============================================================
        function openPlayer(videoUrl, title) {
            if (!videoUrl) {
                showToast('⚠️ Відео недоступне');
                return;
            }
            // Додаємо параметр для кращої сумісності
            const url = videoUrl.includes('?') ? videoUrl + '&autoplay=1' : videoUrl + '?autoplay=1';
            playerIframe.src = url;
            playerTitle.textContent = title || 'Фільм';
            playerSub.textContent = '🎥 HD • безкоштовно • натисніть ▶ для відтворення';
            playerOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() {
            playerOverlay.classList.remove('active');
            playerIframe.src = '';
            document.body.style.overflow = '';
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // SCROLL TOP
        // ============================================================
        window.addEventListener('scroll', function() {
            if (window.scrollY > 400) {
                scrollBtn.classList.add('visible');
            } else {
                scrollBtn.classList.remove('visible');
            }
        });
        scrollBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ============================================================
        // ІНІЦІАЛІЗАЦІЯ
        // ============================================================
        async function init() {
            // Локальна база
            allMovies = MOVIES_DB.slice();

            // Спроба підтягнути Supabase
            try {
                const supData = await fetchSupabaseMovies();
                if (supData.length > 0) {
                    const existing = new Set(allMovies.map(m => m.title + m.year));
                    for (const sm of supData) {
                        const key = sm.title + sm.year;
                        if (!existing.has(key)) {
                            allMovies.push(sm);
                            existing.add(key);
                        }
                    }
                }
            } catch (e) {}

            applyFilters();
            isLoading = false;

            // Обробники подій
            let searchTimeout = null;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchQuery = this.value;
                    applyFilters();
                }, 300);
            });

            filterChips.forEach(chip => {
                chip.addEventListener('click', function() {
                    filterChips.forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    applyFilters();
                });
            });

            playerClose.addEventListener('click', closePlayer);
            playerOverlay.addEventListener('click', function(e) {
                if (e.target === this) closePlayer();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closePlayer();
            });

            showToast('🎬 ' + allMovies.length + ' фільмів готові до перегляду');
        }

        init();
    })();
</script>
