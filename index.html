            try {
                const SUPABASE_URL = 'https://qxtakglepnrnewwynnij.supabase.co';
                const SUPABASE_KEY = 'sb_publishable_W2Db_WneZp2gyi_MUtJ8tQ_dx29imBX';

                const response = await fetch(`${SUPABASE_URL}/rest/v1/movies?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) throw new Error('Supabase fetch failed');
                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    // Мапуємо поля з Supabase (очікуємо: id, title, year, genre, rating, poster, video)
                    const mapped = data.map(item => ({
                        id: item.id || Date.now() + Math.random(),
                        title: item.title || 'Невідомий фільм',
                        year: item.year || 2024,
                        genre: item.genre || 'драма',
                        rating: item.rating || 5.0,
                        poster: item.poster || '',
                        video: item.video || 'https://vidsrc.xyz/embed/movie/157336'
                    }));
                    return mapped;
                }
                return [];
            } catch (e) {
                console.warn('Supabase не відповів, використовуємо локальну базу:', e);
                return [];
            }
        }

        // ============================================================
        // Рендеринг
        // ============================================================
        function renderMovies(movies) {
            if (!movies || movies.length === 0) {
                container.innerHTML = `<div class="empty-state"><span>🎞️</span>Фільмів не знайдено<br><small style="color:#4a5268;">спробуйте інший запит</small></div>`;
                return;
            }

            let html = '<div class="movies-grid">';
            for (const m of movies) {
                const posterHtml = m.poster
                    ? `<img src="${m.poster}" alt="${m.title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
                    : '';
                html += `
                    <div class="movie-card" data-id="${m.id}" data-video="${m.video}" data-title="${m.title}">
                        <div class="movie-poster">
                            ${posterHtml}
                            <span class="fallback-icon" style="display:${m.poster ? 'none' : 'flex'};">🎬</span>
                            <span class="movie-year">${m.year}</span>
                        </div>
                        <div class="movie-info">
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-meta">
                                <span class="movie-rating">★ ${m.rating.toFixed(1)}</span>
                                <span class="movie-genre">${m.genre}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            container.innerHTML = html;

            // Додаємо обробники кліку для карток
            document.querySelectorAll('.movie-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    const video = this.dataset.video;
                    const title = this.dataset.title || 'Фільм';
                    openPlayer(video, title);
                });
                // Для тач-пристроїв — швидкий відгук
                card.addEventListener('touchstart', function() {
                    this.style.transition = 'transform 0.05s';
                }, { passive: true });
            });
        }

        // ============================================================
        // Фільтрація + пошук
        // ============================================================
        function applyFilters() {
            let result = allMovies.slice();

            // Фільтр за жанром / роком
            if (currentFilter !== 'all') {
                const filterLower = currentFilter.toLowerCase();
                result = result.filter(m => {
                    const genreMatch = m.genre && m.genre.toLowerCase().includes(filterLower);
                    const yearMatch = m.year && m.year.toString() === filterLower;
                    return genreMatch || yearMatch;
                });
            }

            // Пошук
            if (searchQuery.trim() !== '') {
                const q = searchQuery.trim().toLowerCase();
                result = result.filter(m =>
                    m.title.toLowerCase().includes(q) ||
                    (m.genre && m.genre.toLowerCase().includes(q)) ||
                    (m.year && m.year.toString().includes(q))
                );
            }

            filteredMovies = result;
            renderMovies(result);
        }

        // ============================================================
        // Плеєр
        // ============================================================
        function openPlayer(videoUrl, title) {
            if (!videoUrl) {
                showToast('Відео недоступне');
                return;
            }
            playerIframe.src = videoUrl;
            playerTitle.textContent = title || 'Фільм';
            playerOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            // Запобігаємо скролінгу фону
        }

        function closePlayer() {
            playerOverlay.classList.remove('active');
            playerIframe.src = '';
            document.body.style.overflow = '';
        }

        // ============================================================
        // Toast повідомлення
        // ============================================================
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        // ============================================================
        // Ініціалізація
        // ============================================================
        async function init() {
            // 1. Завантажуємо локальну базу
            allMovies = BASE_MOVIES.slice();

            // 2. Спроба підтягнути з Supabase (асинхронно, не блокуємо UI)
            try {
                const supabaseMovies = await fetchSupabaseMovies();
                if (supabaseMovies.length > 0) {
                    // Додаємо тільки унікальні (за назвою + роком)
                    const existingTitles = new Set(allMovies.map(m => m.title + m.year));
                    for (const sm of supabaseMovies) {
                        const key = sm.title + sm.year;
                        if (!existingTitles.has(key)) {
                            allMovies.push(sm);
                            existingTitles.add(key);
                        }
                    }
                }
            } catch (e) {
                // ігноруємо помилки Supabase
            }

            // 3. Початковий рендеринг
            applyFilters();

            // 4. Обробники подій
            // Пошук з дебаунсом
            let searchTimeout = null;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchQuery = this.value;
                    applyFilters();
                }, 300);
            });

            // Фільтри
            filterChips.forEach(chip => {
                chip.addEventListener('click', function() {
                    filterChips.forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    applyFilters();
                });
            });

            // Закриття плеєра
            playerClose.addEventListener('click', closePlayer);
            playerOverlay.addEventListener('click', function(e) {
                if (e.target === this) closePlayer();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closePlayer();
            });

            // Показуємо підказку
            showToast('🎥 Натисніть на картку для перегляду');
        }

        // Запуск
        init();
    })();
</script>
